## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Gradle properties
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
org.gradle.jvmargs=-Xmx8192m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
#
# Project properties
kotlin.code.style=official
android.useAndroidX=true
android.enableJetifier=true
android.enableBuildConfigAsBytecode=true
# AGP 9 enables optimized resource shrinking automatically for minified builds.
# Keep the Kotlin Gradle plugin while the Android modules are migrated to AGP's
# built-in Kotlin support.
android.builtInKotlin=false
# Preserve the legacy DSL implementation while custom and third-party plugins
# complete their migration to AGP 9's public variant APIs.
android.newDsl=false
