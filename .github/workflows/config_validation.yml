name: Validate config.json

on:
  pull_request:
    branches:
      - develop
    paths:
      - "android-config/src/playstore/res/raw/config.json"
      - "android-config/src/amazon/res/raw/config.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-config:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: playstore
            config_file: android-config/src/playstore/res/raw/config.json
          - flavor: amazon
            config_file: android-config/src/amazon/res/raw/config.json
    name: validate-config (${{ matrix.flavor }})
    env:
      CONFIG_FILE: ${{ matrix.config_file }}
      SCHEMA_FILE: android-config/schema/config.schema.json
      LARGE_DIFF_THRESHOLD: "75"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch develop branch
        run: git fetch origin develop

      - name: Validate JSON syntax
        run: |
          set -euo pipefail

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error file=$CONFIG_FILE::File not found in PR branch."
            exit 1
          fi

          jq empty "$CONFIG_FILE"
          echo "JSON syntax validation passed for $CONFIG_FILE"

      - name: Validate config.json against schema
        run: |
          set -euo pipefail

          if [ ! -f "$SCHEMA_FILE" ]; then
            echo "::error file=$SCHEMA_FILE::Schema file not found."
            exit 1
          fi

          set +e
          validation_output="$(npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate \
            -s "$SCHEMA_FILE" \
            -d "$CONFIG_FILE" \
            -c ajv-formats \
            --strict=false 2>&1)"
          validation_status=$?
          set -e

          echo "$validation_output"

          if [ $validation_status -ne 0 ]; then
            # Detect the common "unknown property" case and surface a friendlier message.
            if echo "$validation_output" | grep -q "additionalProperty"; then
              offending_props="$(echo "$validation_output" \
                | grep -oE "additionalProperty: '[^']+'" \
                | sed -E "s/additionalProperty: '([^']+)'/\1/" \
                | sort -u \
                | paste -sd ', ' -)"

              echo "::error file=$SCHEMA_FILE::Unknown propert(y|ies) [$offending_props] found in $CONFIG_FILE. Please update the schema to add / remove new properties in config.schema.json."
              echo ""
              echo "❌ Schema validation failed for $CONFIG_FILE"
              echo "   Unknown propert(y|ies): $offending_props"
              echo " Please update the schema to add / remove new properties in config.schema.json"
            else
              echo "::error file=$CONFIG_FILE::Schema validation failed for $CONFIG_FILE. See log above for details."
            fi
            exit $validation_status
          fi

          echo "Schema validation passed for $CONFIG_FILE"

      - name: Warn on large diff
        run: |
          set -euo pipefail

          changed_lines="$(
            git diff --unified=0 origin/develop...HEAD -- "$CONFIG_FILE" \
              | grep -E '^[+-]' \
              | grep -Ev '^\+\+\+|^---' \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$changed_lines" -gt "$LARGE_DIFF_THRESHOLD" ]; then
            echo "::warning file=$CONFIG_FILE::Large config diff detected ($changed_lines changed lines > $LARGE_DIFF_THRESHOLD threshold). Please review carefully."
          else
            echo "Diff size is within threshold ($changed_lines <= $LARGE_DIFF_THRESHOLD)."
          fi

  check-keys-parity:
    runs-on: ubuntu-latest
    needs: validate-config
    name: check-keys-parity (playstore vs amazon)
    env:
      PLAYSTORE_CONFIG: android-config/src/playstore/res/raw/config.json
      AMAZON_CONFIG: android-config/src/amazon/res/raw/config.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Compare key structure
        run: |
          set -euo pipefail

          if [ ! -f "$PLAYSTORE_CONFIG" ] || [ ! -f "$AMAZON_CONFIG" ]; then
            echo "::error::One of the config files is missing."
            exit 1
          fi

          # Extract the set of all key paths (structure only, ignoring values).
          # `paths(scalars)` yields every leaf path; we join with '.' and treat
          # array indices as '[]' so reordering / count differences don't cause
          # spurious mismatches.
          extract_paths() {
            jq -r '
              [paths(scalars)]
              | map(map(if type == "number" then "[]" else . end) | join("."))
              | unique
              | .[]
            ' "$1"
          }

          playstore_paths="$(extract_paths "$PLAYSTORE_CONFIG")"
          amazon_paths="$(extract_paths "$AMAZON_CONFIG")"

          only_in_playstore="$(comm -23 <(echo "$playstore_paths") <(echo "$amazon_paths") || true)"
          only_in_amazon="$(comm -13 <(echo "$playstore_paths") <(echo "$amazon_paths") || true)"

          if [ -z "$only_in_playstore" ] && [ -z "$only_in_amazon" ]; then
            echo "✅ Key structures match between playstore and amazon config.json"
            exit 0
          fi

          echo "❌ Key structure drift detected between playstore and amazon config.json"
          if [ -n "$only_in_playstore" ]; then
            echo ""
            echo "Keys only in $PLAYSTORE_CONFIG:"
            echo "$only_in_playstore" | sed 's/^/  - /'
            echo "::error file=$AMAZON_CONFIG::Missing keys present in playstore: $(echo "$only_in_playstore" | paste -sd ', ' -)"
          fi
          if [ -n "$only_in_amazon" ]; then
            echo ""
            echo "Keys only in $AMAZON_CONFIG:"
            echo "$only_in_amazon" | sed 's/^/  - /'
            echo "::error file=$PLAYSTORE_CONFIG::Missing keys present in amazon: $(echo "$only_in_amazon" | paste -sd ', ' -)"
          fi
          echo ""
          echo "Both files must share the same key structure. Values may differ per store, but every key added to one flavor must also be added to the other."
          exit 1

  bump-version-if-needed:
    permissions:
      contents: write
    needs:
      - validate-config
      - check-keys-parity
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: bump-version-if-needed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch develop branch
        run: git fetch origin develop

      - name: Check and bump versions
        run: |
          set -euo pipefail

          CONFIG_FILES=(
            "android-config/src/playstore/res/raw/config.json"
            "android-config/src/amazon/res/raw/config.json"
          )

          for file in "${CONFIG_FILES[@]}"; do
            if git diff --name-only origin/develop...HEAD -- "$file" | grep -q "$file"; then
              version_pr=$(jq '.version' "$file")
              version_dev=$(jq '.version' <(git show origin/develop:"$file"))

              if [ "$version_pr" -le "$version_dev" ]; then
                new_version=$((version_dev + 1))
                echo "Bumping version in $file -> $new_version"
                 sed -i -E '1,/^[[:space:]]*"version"[[:space:]]*:/s/^([[:space:]]*"version"[[:space:]]*:[[:space:]]*)[0-9]+/\1'"$new_version"'/' "$file"  # safe as long as the root version remains the first version occurrence 
                git add "$file"
              fi
            fi
          done

      - name: Commit and push if changes were made
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Adding [skip ci] prevents re-triggering PR workflows on this push
          git commit -m "chore: bump version in config.json [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
